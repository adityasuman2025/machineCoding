<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            align-items: center;
            justify-content: center;
            background-color: whitesmoke;
        }

        .content {
            display: grid;
            grid-template-columns: repeat(35, 1fr);
        }

        .box {
            width: 20px;
            height: 20px;
            background-color: black;
        }

        .food {
            background-color: rosybrown;
        }

        .snake {
            background-color: aquamarine
        }
    </style>
</head>

<body>
    <section class="container">
        <h2 class="result" id="result">Score</h2>
        <section class="content" id="content"></section>
    </section>

    <script type="text/javascript">
        // utils
        function getRandomNo(start, end) {
            return Math.floor(Math.random() * (end - start + 1) + start);
        }

        // constants
        const COUNT = 35;
        const ARROW_UP = "ArrowUp", ARROW_DOWN = "ArrowDown", ARROW_LEFT = "ArrowLeft", ARROW_RIGHT = "ArrowRight";
        const ALLOWED_KEYS = [ARROW_UP, ARROW_DOWN, ARROW_LEFT, ARROW_RIGHT];

        // event handler
        let snakePos = [getSnakeInitPos(COUNT)]; // array of i_j // , "17_18", "17_19"
        let foodPos = getRandomFoodLoc(COUNT); // i_j
        let updateHeadBy = [0, 0]; // [i, j]
        let prevDrtn;
        let score = 0;
        let interval;

        const resultEle = document.getElementById("result");
        const contentEle = document.getElementById("content");

        document.getElementsByTagName("body")[0].addEventListener("keyup", handleKeyUp);
        function handleKeyUp(e) {
            const key = e.key;
            if (!key || !ALLOWED_KEYS.includes(key)) return;

            // can't move to direct opposite direction
            if (prevDrtn === ARROW_UP && key === ARROW_DOWN) return;
            if (prevDrtn === ARROW_DOWN && key === ARROW_UP) return;
            if (prevDrtn === ARROW_LEFT && key === ARROW_RIGHT) return;
            if (prevDrtn === ARROW_RIGHT && key === ARROW_LEFT) return;
            // can't move to direct opposite direction

            if (key === ARROW_UP) updateHeadBy = [-1, 0]; // updateHeadBy: i = -1, j = 0     
            else if (key === ARROW_DOWN) updateHeadBy = [+1, 0]; // updateHeadBy: i = +1, j = 0
            else if (key === ARROW_LEFT) updateHeadBy = [0, -1]; // updateHeadBy: i = 0, j = -1
            else if (key === ARROW_RIGHT) updateHeadBy = [0, +1]; // updateHeadBy: i = 0, j = +1

            prevDrtn = key;

            if (!interval) startMoving();
        }

        function startMoving() {
            _clearInterval()

            interval = setInterval(() => {
                const [updatedHeadI, updatedHeadJ, updatedHeadPos] = getUpdatedHeadPos(snakePos[0], updateHeadBy);

                // snake's head touched boundary
                if (updatedHeadI < 1 || updatedHeadI > COUNT || updatedHeadJ < 1 || updatedHeadJ > COUNT) return handleGameOver();

                if (updatedHeadPos === foodPos) {
                    // snake's head ate a food -> make the food position as head
                    snakePos.unshift(foodPos);
                    foodPos = getRandomFoodLoc(COUNT); // setting food to a new position
                    score++;
                } else {
                    // if snake don't eat any food, then its head position will change by updateHeadBy and rest of the body will remain same
                    snakePos.unshift(updatedHeadPos);
                    snakePos.pop();
                }

                // checking self collision
                for (let idx = 1; idx < snakePos.length; idx++) {
                    if (snakePos[idx] === snakePos[0]) return handleGameOver();
                }

                renderGrid();
            }, 200);
        }

        function getUpdatedHeadPos(item, updater) {
            const [i, j] = item.split("_");

            const updatedI = Number(i) + updater[0], updatedJ = Number(j) + updater[1];
            const updatedPos = updatedI + "_" + updatedJ;

            return [updatedI, updatedJ, updatedPos];
        }

        function renderGrid() {
            const frag = document.createDocumentFragment();
            for (let i = 1; i <= COUNT; i++) {
                for (let j = 1; j <= COUNT; j++) {
                    const thisPos = i + "_" + j;
                    const boxEle = document.createElement("div");
                    boxEle.classList.add("box");
                    boxEle.dataset.i = i;
                    boxEle.dataset.j = j;

                    if (foodPos === thisPos) boxEle.classList.add("food");
                    if (snakePos.includes(thisPos)) boxEle.classList.add("snake");

                    frag.appendChild(boxEle);
                }
            }

            resultEle.innerHTML = "Your score is " + score;
            contentEle.replaceChildren(frag);
        }
        renderGrid();

        function getRandomFoodLoc(limit) {
            let newLoc = getRandomNo(1, limit) + "_" + getRandomNo(1, limit);
            while (snakePos.includes(newLoc)) newLoc = getRandomNo(1, limit) + "_" + getRandomNo(1, limit);
            return newLoc
        }

        function getSnakeInitPos(limit) {
            return Math.floor(limit / 2) + "_" + Math.floor(limit / 2);
        }

        function handleGameOver() {
            resultEle.innerHTML = "Game Over, Your score is " + score;

            // resetting
            snakePos = [getSnakeInitPos(COUNT)]
            foodPos = getRandomFoodLoc(COUNT);
            updateHeadBy = [0, 0];
            score = 0;
            _clearInterval();
            contentEle.remove();
        }

        function _clearInterval() {
            if (interval) {
                clearInterval(interval);
                interval = undefined;
            }
        }
    </script>
</body>

</html>
