<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spreadsheet</title>
    <link rel="stylesheet" href="/spreadsheet/styles.css">
</head>

<body>
    <!-- Formula Bar Section (Reset button nested inside) -->
    <section class="formula-bar-container" aria-label="Formula Editor">
        <div class="cell-coord-indicator" id="active-cell-id">A1</div>
        <div class="formula-icon" aria-hidden="true">fx</div>
        <div class="formula-input-wrapper">
            <input type="text" class="formula-input" id="formula-input"
                placeholder="Enter numbers, or formulas starting with = (e.g. =A1*2 + SUM(B1:B5))" autocomplete="off"
                spellcheck="false">
        </div>
        <button class="btn btn-secondary btn-danger" id="btn-reset" style="margin-left: 10px;">Reset</button>
    </section>

    <!-- Main Workspace (Full width sheet grid only) -->
    <main class="workspace-container">
        <div class="grid-container" id="grid-container">
            <table class="spreadsheet-grid" id="spreadsheet-table"></table>
        </div>
    </main>

    <script src="/spreadsheet/engine.js"></script>
</body>

</html>
