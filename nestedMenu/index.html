<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Menu</title>

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .menuItem {
            padding: 10px;
            background-color: antiquewhite;
            border: 1px solid grey;
            position: relative;
            width: 200px;
            box-sizing: border-box;
        }

        .absolute {
            position: absolute;
            top: 50%;
            left: 100%;
        }
    </style>
</head>

<body>
    <section class="content" id="content"></section>

    <script type="text/javascript">
        const menu = [
            { title: "why prep" },
            {
                title: "courses",
                menu: [
                    { title: "DSA to development" },
                    {
                        title: "for professionals",
                        menu: [{ title: "DSA Classes Live" }, { title: "System Design Live" }, { title: "Java BE Live" }, { title: "Devops Live" }]
                    },
                    {
                        title: "for students",
                        menu: [{ title: "Interview Prep Course" }, { title: "Data Science Live" }, { title: "Gate CS / IT 2024" }, { title: "Master CP" }]
                    }
                ]
            },
            {
                title: "tutorials",
                menu: [
                    { title: "DSA for beginners" },
                    {
                        title: "DSA",
                        menu: [
                            { title: "Arrays" },
                            { title: "String" },
                            {
                                title: "LinkedList",
                                menu: [{ title: "Single LinkedList" }, { title: "Double LinkedList" }, { title: "Circular LinkedList" }]
                            },
                            { title: "Stack" },
                            { title: "Queue" },
                            {
                                title: "Tree",
                                menu: [{ title: "BST" }, { title: "Binary Tree" }, { title: "AVL Tree" }]
                            },
                            { title: "Heap" },
                            { title: "Graph" },
                        ]
                    },
                    {
                        title: "System Design",
                        menu: [
                            {
                                title: "Design Pattern",
                                menu: [{ title: "factory" }]
                            },
                            {
                                title: "Design Tutorial",
                                menu: [
                                    {
                                        title: "What is system design",
                                        menu: [{ title: "key terminology" }, { title: "databases" }, { title: "HLD" }, { title: "LLD" }]
                                    }
                                ]
                            }
                        ]
                    }
                ]
            }
        ];
        let activeIds = [];

        const contentItem = document.getElementById("content");
        contentItem.addEventListener("click", handleMenuClick);
        function handleMenuClick(e) {
            const { id } = e.target.dataset;
            if (id) {
                activeIds = [...getAncestorIds(id)];
                contentItem.replaceChildren(renderMenu(menu, ""));
            }
        }

        function getAncestorIds(id) {
            let temp = "";
            return id.split(".").reduce((acc, item) => {
                temp = (temp ? temp + "." : "") + item;
                return [...acc, temp];
            }, []);
        }

        function renderMenu(menu, parentIdx) {
            const frag = document.createDocumentFragment();

            menu.forEach((item, idx) => {
                const menuItemEle = document.createElement("div");
                menuItemEle.innerText = item.title + (item.menu?.length ? " >" : "");
                menuItemEle.classList.add("menuItem");

                const eleId = (parentIdx ? parentIdx + "." : "") + idx;
                menuItemEle.dataset.id = eleId;

                if (item.menu?.length && activeIds.includes(eleId)) {
                    const childEle = document.createElement("div");
                    childEle.classList.add("absolute");
                    childEle.append(renderMenu(item.menu, eleId));
                    menuItemEle.append(childEle);
                }

                frag.append(menuItemEle);
            });

            return frag;
        }
        contentItem.replaceChildren(renderMenu(menu, ""));
    </script>
</body>

</html>
