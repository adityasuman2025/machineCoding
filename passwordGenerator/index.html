<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        #content {
            text-align: center;
        }
    </style>
</head>

<body>
    <div id="content"></div>
    <script>
        /* 
            In a password is mandatory
            1. at least 1 number
            2. at least 1 special char
            3. at least 1 Uppercase alphabet
            4. at least 1 Lowercase alphabet
        */

        const PASS_LENGTH = 15;
        const FUNCS = [() => generateNo(0, 9), () => generateAlphabet(true), () => generateAlphabet(false), generateSpecialChar];

        const contentEle = document.getElementById("content");
        contentEle.innerText = "Random generated password of length " + PASS_LENGTH + " is: " + getPassword(PASS_LENGTH);

        function getPassword(passLength) {
            const pass = [generateNo(0, 9), generateAlphabet(true), generateAlphabet(false), generateSpecialChar()];

            const rqdLen = passLength - pass.length;
            for (let i = 0; i < rqdLen; i++) {
                const random = generateNo(0, FUNCS.length - 1);
                const func = FUNCS[random];
                pass.push(func())
            }

            shuffleArray(pass);
            return pass.join("");
        }

        function generateNo(start, end) {
            return Math.floor(Math.random() * (end - start + 1) + start);
        }

        function generateAlphabet(isUpper) {
            /*
                ASCII
                upper case: 65 - 90
                lower case: 97 - 122
            */
            const asciiCode = isUpper ? generateNo(65, 90) : generateNo(97, 122);
            return String.fromCharCode(asciiCode);
        }

        function generateSpecialChar() {
            const specialChars = "!@#$%^&*()_+~`|}{[]:;?><,./-=";
            const idx = generateNo(0, specialChars.length - 1);

            return specialChars[idx];
        }

        function shuffleArray(arr) {
            for (let i = 0; i < arr.length - 1; i++) {
                const rand = generateNo(i, arr.length - 1);

                let temp = arr[i];
                arr[i] = arr[rand];
                arr[rand] = temp;
            }
        }
    </script>
</body>

</html>
