<!DOCTYPE html>
<html>

<head>
    <title>Auto Complete</title>
    <meta charset="UTF-8" />
    <style>
        .content {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            align-items: center;
            justify-content: center;
            background-color: antiquewhite;
        }

        .searchBox {
            width: 400px;
            position: relative;
            box-sizing: border-box;
        }

        #searchInput {
            width: 100%;
            height: 40px;
            box-sizing: border-box;
        }

        #suggestionBox {
            width: 100%;
            margin: 0px;
            padding: 5px;
            box-sizing: border-box;
            position: absolute;
            background-color: aliceblue;
            list-style: none;
        }

        #suggestionBox li {
            list-style: none;
            margin-bottom: 2px;
            padding: 5px;
            background-color: beige;
            cursor: pointer;
        }

        .display-none {
            display: none;
        }
    </style>
</head>

<body>
    <section class="content">
        <div class="searchBox">
            <input type="text" id="searchInput" autofocus="true" />
            <ul class="display-none" id="suggestionBox"></ul>
        </div>
        hey
    </section>

    <script type="text/javascript">
        // utils & constants
        function debounce(func, delay) {
            let timer;
            return function(...args) {
                if (timer) clearTimeout(timer);
                timer = setTimeout(() => {
                    func.call(this, ...args)
                }, delay);
            }
        }

        function memoiseIt(func) {
            const cache = {};

            return function(...args) {
                const key = JSON.stringify(args);

                if (!cache.hasOwnProperty(key)) cache[key] = func.call(this, ...args);

                return cache[key];
            }
        }

        async function apiCall(url) {
            await fetch(url);
            if (!resp.ok) throw new Error(`HTTP ${resp.status} ${resp.statusText}`);
            return resp.json();
        }

        function mockApiCall(data) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    resolve(data);
                }, 1000);
            })
        }

        const DATA = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];


        // event handlers
        const inputEle = document.getElementById("searchInput");
        const suggsBoxEle = document.getElementById("suggestionBox");

        const memoisedGetSuggestions = memoiseIt(getSuggestions); // memoiseIt can memoise a async function too, for ref check coreJs/memoAsync
        const debounceDandleInputChange = debounce(handleInputChange, 200);
        inputEle.addEventListener("keyup", debounceDandleInputChange);
        async function handleInputChange(e) {
            const value = (e.target.value).trim();

            const suggs = await memoisedGetSuggestions(value);
            renderSuggestions(suggs);
        }

        suggsBoxEle.addEventListener("click", handleSuggestionClick);
        function handleSuggestionClick(e) {
            const id = e.target.dataset.id;
            if (id) {
                inputEle.value = id;
                suggsBoxEle.classList.add("display-none")
            }
        }


        // helpers
        async function getSuggestions(qry) {
            if (!qry) return [];
            const data = await mockApiCall(DATA);  //  DATA; //
            return data.filter(item => item.includes(qry));
        }

        function renderSuggestions(suggs) {
            if (!suggs.length) return suggsBoxEle.classList.add("display-none");

            const frag = document.createElement("div");
            suggs.forEach(suggItem => {
                const liEle = document.createElement("li");
                liEle.innerText = suggItem;
                liEle.dataset.id = suggItem;

                frag.appendChild(liEle);
            });

            suggsBoxEle.classList.remove("display-none");
            suggsBoxEle.innerHTML = frag.innerHTML;
        }
    </script>
</body>

</html>
