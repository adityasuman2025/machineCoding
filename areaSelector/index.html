<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Selector</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .content {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            align-items: center;
            justify-content: center;
            background-color: whitesmoke;
        }

        .grid {
            display: grid;
            border: 1px solid black;
        }

        .box {
            width: 30px;
            height: 30px;
            border: 1px solid black;
            box-sizing: border-box;
        }

        .hover {
            background-color: bisque;
        }
    </style>
</head>

<body>
    <div class="content">
        <h3>Click & hold on a box and drag to select multiple boxes</h3>
        <section class="grid" id="grid"></section>
    </div>

    <script>
        // utils & constants
        function debounce(func, delay) {
            let timer;
            return function(...args) {
                if (timer) clearTimeout(timer);
                timer = setTimeout(() => {
                    func.call(this, ...args)
                }, delay);
            }
        }

        const BOX_DIM = 30;


        // event handlers
        let isMouseDown = false;
        let startIdx = {}, endIdx = {};

        const wWidth = window.innerWidth;
        const wHeight = window.innerHeight;

        const rows = Math.floor(wHeight / BOX_DIM) - 2;
        const cols = Math.floor(wWidth / BOX_DIM) - 2;

        const gridEle = document.getElementById("grid");
        gridEle.style.gridTemplateRows = "repeat(" + rows + ", 1fr)";
        gridEle.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
        renderGrid(rows, cols);


        gridEle.addEventListener("mousedown", function(e) {
            isMouseDown = true;

            const { row, column } = e.target.dataset;
            startIdx = { row, column };
            endIdx = { row, column };
            renderGrid();
        });

        gridEle.addEventListener("mousemove", function(e) {
            if (isMouseDown === true) {
                const { row, column } = e.target.dataset;
                endIdx = { row, column };
                debouncedRenderGrid();
            }
        });

        gridEle.addEventListener("mouseup", function(e) {
            isMouseDown = false;
            startIdx = {}, endIdx = {};
            renderGrid();
        });

        const debouncedRenderGrid = debounce(renderGrid, 10);
        function renderGrid() {
            console.log("renderGrid")
            const frag = document.createElement("div");
            for (let r = 1; r <= rows; r++) {
                for (let c = 1; c <= cols; c++) {
                    const boxEle = document.createElement("div");
                    boxEle.classList.add("box");
                    boxEle.dataset.row = r;
                    boxEle.dataset.column = c;

                    if (Object.keys(startIdx).length && Object.keys(endIdx).length) {
                        if (
                            (r >= Math.min(startIdx.row, endIdx.row) && c >= Math.min(startIdx.column, endIdx.column))
                            && (r <= Math.max(startIdx.row, endIdx.row) && c <= Math.max(startIdx.column, endIdx.column))
                        ) boxEle.classList.add("hover");
                    }

                    frag.appendChild(boxEle);
                }
            }

            gridEle.innerHTML = frag.innerHTML;
        }
    </script>
</body>

</html>
