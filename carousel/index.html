<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel</title>

    <style>
        #container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        body {
            margin: 0px;
            padding: 0px;
        }

        .slider {
            width: 100%;
            max-width: 800px;
            height: 350px;
            position: relative;
            overflow: hidden;
            border-radius: 15px;
        }

        .slider-track {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }

        .slide {
            flex: 0 0 100%;
            height: 100%;
            position: relative;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .imgTitle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.5);
            width: 100%;
            text-align: center;
            font-size: 20px;
        }

        .btn {
            position: absolute;
            width: 40px;
            height: 40px;
            padding: 10px;
            border: none;
            border-radius: 50%;
            z-index: 10px;
            cursor: pointer;
            background-color: #fff;
            font-size: 18px;
        }

        .btn-prev {
            top: 45%;
            left: 2%;
        }

        .btn-next {
            top: 45%;
            right: 2%;
        }
    </style>
</head>

<body>
    <div id="container"></div>

    <script type="module">
        function carousel(images, element) {
            const WIDTH = 800;

            let sliderTrack;

            (function renderSlider() {
                const slider = document.createElement("div");
                slider.classList.add("slider");
                slider.id = "slider";

                sliderTrack = document.createElement("div");
                sliderTrack.classList.add("slider-track");

                //rendering images
                images.forEach((item, index) => {
                    const slide = document.createElement("div");
                    slide.classList.add("slide");

                    const imgHtml = document.createElement("img");
                    imgHtml.src = item.img;
                    imgHtml.alt = "image_" + index;
                    imgHtml.loading = "lazy";
                    slide.append(imgHtml);

                    const imgTitle = document.createElement("div");
                    imgTitle.innerText = item.title;
                    imgTitle.classList.add("imgTitle");
                    slide.append(imgTitle);

                    sliderTrack.append(slide);
                });

                slider.append(sliderTrack);

                //rendering control buttons
                const buttonNext = document.createElement("button");
                buttonNext.classList.add("btn");
                buttonNext.classList.add("btn-next");
                buttonNext.id = "btn-next";
                buttonNext.innerText = ">";

                const buttonPrev = document.createElement("button");
                buttonPrev.classList.add("btn");
                buttonPrev.classList.add("btn-prev");
                buttonPrev.id = "btn-prev";
                buttonPrev.innerText = "<";

                slider.append(buttonNext);
                slider.append(buttonPrev);
                element.append(slider);
            })();


            //carousel logic
            const slides = document.getElementsByClassName("slide");
            const totalSlides = slides.length;

            document.getElementById("btn-prev").addEventListener("click", movePrev);
            document.getElementById("btn-next").addEventListener("click", moveNext);

            let active = 0;
            function moveNext() {
                active = (active == totalSlides - 1) ? 0 : active + 1;
                moveSlides()
            }

            function movePrev() {
                active = (active == 0) ? totalSlides - 1 : active - 1;
                moveSlides()
            }

            function moveSlides() {
                // Update transform on the parent track instead of looping over each slide!
                sliderTrack.style.transform = `translateX(${-active * 100}%)`;
            }

            let interval = setInterval(moveNext, 2000);


            //stopping slider on mouseover and resuming on mouseleave
            const slider = document.getElementById("slider");
            slider.addEventListener("mouseover", function() {
                clearInterval(interval);
            });
            slider.addEventListener("mouseleave", function() {
                interval = setInterval(moveNext, 2000);
            });
        }

        let imgs = [{
            img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/54/Wiki%2C_wiki%2C_wiki%2C_wiki_logo.jpg/1280px-Wiki%2C_wiki%2C_wiki%2C_wiki_logo.jpg',
            title: "mountain"
        }, {
            img: "https://www.shutterstock.com/image-illustration/wiki-white-text-on-colorful-260nw-652283941.jpg",
            title: "cars"
        }, {
            img: "https://t4.ftcdn.net/jpg/00/64/11/53/360_F_64115359_HO5iNeDGu9D9bZpDygtd3PwLy9v0McOU.jpg",
            title: "night"
        }, {
            img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTMGgEQRkG5m93dHc-GlRpvx-hBsXtbKzJtEA&s",
            title: "city"
        }];

        carousel(imgs, document.getElementById("container"));
    </script>
</body>

</html>
