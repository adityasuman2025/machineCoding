<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .content {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            align-items: center;
            justify-content: center;
            background-color: whitesmoke;
        }

        .container {
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid black;
            margin-bottom: 5px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin: 10px 0px;
        }

        .red {
            color: red;
        }

        .box {
            width: 40px;
            height: 40px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .dummyBox {
            width: 40px;
            height: 40px;
            box-sizing: border-box;
        }

        .today {
            background-color: chocolate;
            border-radius: 100%;
            color: beige
        }

        .active {
            border: 1px solid grey;
            border-radius: 100%;
        }

        .date {
            font-size: 18px;
            text-align: center;
        }
    </style>
</head>

<body>
    <section class="content">
        <div class="container" id="screen">
            <div class="header">
                <button id="prev">prev</button>

                <select id="month"></select>
                <select id="year"></select>

                <button id="next">next</button>
            </div>

            <div class="grid" id="gridWeekdays"></div>
            <div class="grid" id="grid"></div>
            <div class="date" id="date">date</div>
        </div>
    </section>
    <script type="text/javascript">

        const MONTHS = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];;
        const WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

        // event handlers
        let date = new Date();

        const gridEle = document.getElementById("grid");
        const dateEle = document.getElementById("date");
        const preBtnEle = document.getElementById("prev");
        const nextBtnEle = document.getElementById("next");
        const monthSelectEle = document.getElementById("month");
        const yearSelectEle = document.getElementById("year");

        gridEle.addEventListener("click", handleDateClick);
        function handleDateClick(e) {
            const fullDate = e.target.dataset.fullDate;
            if (fullDate) {
                date = new Date(fullDate);
                renderGrid();
                renderDate();
            }
        }

        preBtnEle.addEventListener("click", handlePrevClick);
        function handlePrevClick() {
            date = new Date(date.getFullYear(), date.getMonth() - 1, 1);
            renderGrid();
            renderDate();

            renderYearSelectBox();
            renderMonthSelectBox();
        }

        nextBtnEle.addEventListener("click", handleNextClick);
        function handleNextClick() {
            date = new Date(date.getFullYear(), date.getMonth() + 1, 1);
            renderGrid();
            renderDate();

            renderYearSelectBox();
            renderMonthSelectBox();
        }

        monthSelectEle.addEventListener("change", handleMonthChange);
        function handleMonthChange(e) {
            date = new Date(date.getFullYear(), MONTHS.indexOf(e.target.value), 1);
            renderGrid();
            renderDate();
        }

        yearSelectEle.addEventListener("change", handleYearChange);
        function handleYearChange(e) {
            date = new Date(e.target.value, date.getMonth(), 1);
            renderGrid();
            renderDate();
        }

        // renderers
        function renderGrid() {
            const firstDay = new Date(date.getFullYear(), date.getMonth(), 1);
            const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0);

            const firstDayday = firstDay.getDay();
            const lastDaydate = lastDay.getDate();

            const frag = document.createElement("div");
            // adding dummy cell before starting of fast date of the month for the active date
            new Array(firstDayday).fill(0).forEach(item => {
                const cell = document.createElement("div");
                cell.classList.add("dummyBox");
                frag.appendChild(cell);
            });

            // adding active date, date cells
            new Array(lastDaydate).fill(0).forEach((_, idx) => {
                const thisDate = new Date(date.getFullYear(), date.getMonth(), idx + 1);
                const cell = document.createElement("div");
                cell.innerText = idx + 1;
                cell.dataset.date = idx + 1;
                cell.dataset.fullDate = thisDate;

                cell.classList.add("box");
                if ((idx + firstDayday) % 7 === 0) cell.classList.add("red");
                if (thisDate.toDateString() === new Date().toDateString()) cell.classList.add("today");
                if (thisDate.toDateString() === date.toDateString()) cell.classList.add("active");

                frag.appendChild(cell);
            });

            gridEle.innerHTML = frag.innerHTML;
        }
        renderGrid();

        function renderDate() {
            dateEle.innerText = date.toDateString();
        }
        renderDate();

        (function renderWeekdays() {
            const gridWeekdaysEle = document.getElementById("gridWeekdays");

            WEEKDAYS.forEach((item, idx) => {
                const ele = document.createElement("div");
                ele.innerText = item[0];
                ele.classList.add("box");
                if (idx === 0) ele.classList.add("red");

                gridWeekdaysEle.appendChild(ele)
            })
        })();

        function renderMonthSelectBox() {
            const frag = document.createElement("div");
            MONTHS.forEach((item, idx) => {
                const optionEle = document.createElement("option");
                optionEle.value = item;
                optionEle.innerText = item;
                if (idx === date.getMonth()) optionEle.defaultSelected = true
                frag.appendChild(optionEle);
            });

            monthSelectEle.innerHTML = frag.innerHTML;
        };
        renderMonthSelectBox();

        function renderYearSelectBox() {
            const frag = document.createElement("div");
            new Array(date.getFullYear() - 2000).fill(0).forEach((item, idx) => {
                const thisYear = 2000 + idx + 1;
                const optionEle = document.createElement("option");
                optionEle.value = thisYear
                optionEle.innerText = thisYear
                if (thisYear === date.getFullYear()) optionEle.defaultSelected = true
                frag.appendChild(optionEle);
            });

            yearSelectEle.innerHTML = frag.innerHTML;
        }
        renderYearSelectBox();
    </script>
</body>

</html>
