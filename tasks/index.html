<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>


    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .inputWrapper {
            padding: 50px;
            width: 100%;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            justify-content: center;
        }

        .inputWrapper input {
            width: 200px;
            height: 35px;
        }

        .content {
            padding: 100px;
            display: flex;
            gap: 50px;
            width: 100%;
            box-sizing: border-box;
            overflow-x: auto;
        }

        .block {
            padding: 10px;
            background-color: antiquewhite;
            width: 600px;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .cards {
            padding: 0px;
            margin: 0px;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card {
            background-color: azure;
            padding: 10px;
            box-sizing: border-box;
            width: 100%;
            cursor: grab;
        }
    </style>
</head>

<body>
    <div id="content">
        <section class="inputWrapper">
            <input id="input" type="text" />
        </section>
        <section class="content" id="content"></section>
    </div>

    <script type="text/javascript">
        const TO_DO = "toDo", IN_PROGRESS = "inProgress", DEV_DONE = 'devDone';
        let tasks = {
            [TO_DO]: ["eat pizza", "make video", "do exercise", "drink water"],
            [IN_PROGRESS]: ["coding"],
            [DEV_DONE]: ["visit market"]
        }

        const inputEle = document.getElementById("input");
        inputEle.addEventListener("keyup", handleInputChange);
        function handleInputChange(e) {
            const val = e.target.value;

            if (val && e.key === "Enter") {
                tasks[TO_DO].push(val);
                render();
            }
        }

        let draggingEle, dropTo, dragFrom;

        const contentEle = document.getElementById("content");
        contentEle.addEventListener("dragstart", handleDragStart);
        function handleDragStart(e) {
            const { type, id } = e.target.dataset;
            if (type && id) {
                dragFrom = type;
                draggingEle = e.target;
                draggingEle.style.opacity = 0.6;
            }
        }

        contentEle.addEventListener("dragover", handleDragOver);
        function handleDragOver(e) {
            e.preventDefault(); // This is essential to enable dropping

            const { type } = e.target.dataset;
            dropTo = type;
        }

        contentEle.addEventListener("drop", handleDrop);
        function handleDrop(e) {
            e.preventDefault();
            if (dragFrom === dropTo) return cleanUp();

            if (draggingEle && Object.keys(tasks).includes(dropTo)) {
                const { type, id } = draggingEle.dataset;

                tasks = Object.keys(tasks).reduce((acc, blockKey) => {
                    if (blockKey === type) return { ...acc, [blockKey]: tasks[blockKey].filter((_, idx) => idx !== Number(id)) }
                    else if (blockKey === dropTo) return { ...acc, [blockKey]: [...tasks[blockKey], tasks[type][id]] }
                    else return { ...acc, [blockKey]: tasks[blockKey] };
                }, {});

                render();
            }

            cleanUp();
        }

        function cleanUp() {
            draggingEle = null;
            dragFrom = null;
            dropTo = null;
        }

        render();
        function render() {
            const frag = document.createDocumentFragment();

            Object.keys(tasks).forEach(blockKey => {
                const blockEle = document.createElement("section");
                blockEle.classList.add("block");
                blockEle.dataset.type = blockKey;

                const titleEle = document.createElement("h2");
                titleEle.innerText = blockKey;
                blockEle.appendChild(titleEle);

                const cardsEle = document.createElement("ul");
                cardsEle.classList.add("cards");
                tasks[blockKey].forEach((task, taskId) => {
                    const taskEle = document.createElement("li");
                    taskEle.classList.add("card");
                    taskEle.innerText = task;
                    taskEle.dataset.type = blockKey;
                    taskEle.dataset.id = taskId;
                    taskEle.draggable = "true";

                    cardsEle.appendChild(taskEle);
                });
                blockEle.appendChild(cardsEle);

                frag.appendChild(blockEle);
            });

            contentEle.replaceChildren(frag);
        }
    </script>
</body>

</html>
