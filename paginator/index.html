<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paginator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            align-items: center;
            justify-content: center;
            background-color: whitesmoke;
        }

        .content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .pageBtns {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .active {
            background-color: aquamarine;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <section class="container">
        <section class="content" id="content">
            <button data-idx="prev">prev</button>
            <div class="pageBtns" id="pageBtns"></div>
            <button data-idx="next">next</button>
        </section>
    </section>

    <script type="text/javascript">
        const TOTAL_ITEMS = 100;
        const ITEMS_PER_PAGE = 10;
        const COUNT = TOTAL_ITEMS / ITEMS_PER_PAGE; // no of pages
        const NO_OF_VISIBLE_BTNS = 5;

        let activeBtnIdx = 0;

        const pageBtnsEle = document.getElementById("pageBtns");
        const contentEle = document.getElementById("content");
        contentEle.addEventListener("click", handleBtnClick);
        function handleBtnClick(e) {
            const { idx } = e.target.dataset;
            if (!idx) return;

            if (idx === "prev" && activeBtnIdx > 0) activeBtnIdx--;
            else if (idx === "next" && activeBtnIdx < COUNT - 1) activeBtnIdx++;
            else if (isNumber(idx)) activeBtnIdx = Number(idx);
            else return;

            renderBtns();
        }

        function renderBtns() {
            const frag = document.createDocumentFragment();

            if (activeBtnIdx < NO_OF_VISIBLE_BTNS - 2) {
                new Array(NO_OF_VISIBLE_BTNS - 1).fill(0).forEach((_, idx) => frag.append(getBtnEle(idx)));

                frag.append(getBtnEle("..."));
                frag.append(getBtnEle(COUNT - 1));
            } else if (activeBtnIdx > COUNT - (NO_OF_VISIBLE_BTNS - 1)) {
                frag.append(getBtnEle(0));
                frag.append(getBtnEle("..."));
                new Array((NO_OF_VISIBLE_BTNS - 1)).fill(0).forEach((_, idx) => frag.append(getBtnEle(COUNT - (NO_OF_VISIBLE_BTNS - 1) + idx)));
            } else {
                frag.append(getBtnEle(0));
                frag.append(getBtnEle("..."));

                frag.append(getBtnEle(activeBtnIdx - 1));
                frag.append(getBtnEle(activeBtnIdx));
                frag.append(getBtnEle(activeBtnIdx + 1));

                frag.append(getBtnEle("..."));
                frag.append(getBtnEle(COUNT - 1));
            }

            pageBtnsEle.replaceChildren(frag);
        }
        renderBtns();

        function getBtnEle(idx) {
            const btnEle = document.createElement("button");
            btnEle.innerText = idx === "..." ? "..." : idx + 1;
            btnEle.dataset.idx = idx;
            if (idx === activeBtnIdx) btnEle.classList.add("active");

            return btnEle;
        }

        function isNumber(str) {
            return isFinite(Number(str)) && str.trim() !== "";
        }
    </script>
</body>

</html>
