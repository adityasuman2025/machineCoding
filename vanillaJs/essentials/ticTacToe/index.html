<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            height: 100vh;
            box-sizing: border-box;
        }

        .content {
            display: grid;
            border: 1px solid black;
            /* grid-template-columns: repeat(3, 1fr); */
        }

        .box {
            width: 50px;
            height: 50px;
            border: 1px solid black;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .disabled {
            opacity: 0.3;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <section class="container">
        <h2 id="result">x turn</h2>
        <section class="content" id="content"></section>
    </section>

    <script type="text/javascript">
        const SIZE = 3;
        const X = "X", O = "O";
        const X_WINS = new Array(SIZE).fill(X).join(""), O_WINS = new Array(SIZE).fill(O).join("");
        const WINS_ARR = [X_WINS, O_WINS];

        // event handlers
        let turn = X; // "O"
        let gridData = new Array(SIZE).fill("").map(() => new Array(SIZE).fill(""));
        let isPaused = false;

        const resultEle = document.getElementById("result");

        const contentEle = document.getElementById("content");
        contentEle.style.gridTemplateColumns = "repeat(" + SIZE + ", 1fr)"
        contentEle.addEventListener("click", handleContentClick);
        function handleContentClick(e) {
            const { i, j } = e.target.dataset;

            if (!isPaused && i && j && !gridData[i - 1][j - 1]) {
                gridData[i - 1][j - 1] = turn;
                turn = turn === X ? O : X;
                renderGrid();

                const isWinner = checkWinner();
                if (isWinner) return makeWinner();
            }
        }

        function checkWinner() {
            // checking horizontally
            const horiIdx = gridData.findIndex(row => WINS_ARR.includes(row.join("")))
            if (horiIdx >= 0) return true;

            // checking vertically && diagonally
            let vertArr = new Array(SIZE).fill(""), diagStr = "", diagStr2 = "";
            for (let i = 0; i < SIZE; i++) {
                for (let j = 0; j < SIZE; j++) {
                    const item = gridData[i][j];
                    if (i === j) diagStr += item;
                    if (i + j === SIZE - 1) diagStr2 += item;

                    vertArr[j] = vertArr[j] += item;
                }
            }

            return vertArr.includes(X_WINS) || vertArr.includes(O_WINS) || WINS_ARR.includes(diagStr) || WINS_ARR.includes(diagStr2);
        }

        function makeWinner() {
            turn = turn === X ? O : X; // resetting the turn
            isPaused = true;
            resultEle.innerText = turn + " won";
            contentEle.classList.add("disabled")
        }

        renderGrid();
        function renderGrid() {
            const frag = document.createDocumentFragment();
            for (let i = 1; i <= SIZE; i++) {
                for (let j = 1; j <= SIZE; j++) {
                    const boxEle = document.createElement("div");
                    boxEle.classList.add("box");
                    boxEle.dataset.i = i;
                    boxEle.dataset.j = j;
                    boxEle.innerText = gridData[i - 1][j - 1];

                    frag.appendChild(boxEle);
                }
            }

            resultEle.innerText = turn + "'s turn";
            contentEle.replaceChildren(frag)
        }
    </script>
</body>

</html>
