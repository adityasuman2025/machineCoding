<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .content {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            align-items: center;
            justify-content: center;
            background-color: whitesmoke;
        }

        .screen {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            width: 200px;
            height: 50px;
            padding: 5px;
            box-sizing: border-box;
            border: 1px solid black;
            margin-bottom: 5px;
        }

        .grid {
            width: 200px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .number {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            box-sizing: border-box;
            background-color: bisque;
            cursor: pointer;
        }

        .operator {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 45px;
            height: 45px;
            box-sizing: border-box;
            background-color: chocolate;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <section class="content">
        <div class="screen" id="screen"></div>
        <div class="grid" id="grid">
            <div class="number" data-id="1">1</div>
            <div class="number" data-id="2">2</div>
            <div class="number" data-id="3">3</div>
            <div class="operator" data-id="C">C</div>

            <div class="number" data-id="4">4</div>
            <div class="number" data-id="5">5</div>
            <div class="number" data-id="6">6</div>
            <div class="operator" data-id="+">+</div>

            <div class="number" data-id="7">7</div>
            <div class="number" data-id="8">8</div>
            <div class="number" data-id="9">9</div>
            <div class="operator" data-id="-">-</div>

            <div class="number" data-id="=">=</div>
            <div class="number" data-id="0">0</div>
            <div class="number" data-id="x">x</div>
            <div class="operator" data-id="/">/</div>
        </div>
    </section>

    <script type="text/javascript">
        const OPERATORS = "+-x/C=";

        const screenEle = document.getElementById("screen");
        const gridEle = document.getElementById("grid");
        gridEle.addEventListener("click", handleClick);

        let res = "0", pendingOperator;
        function handleClick(e) {
            const thisEle = e.target;
            const id = thisEle.dataset.id;
            if (!id) return;

            if (OPERATORS.includes(id)) {
                if (id === "C") res = "0";
                else if (id === "=") doCalculation();
                else res = res + (OPERATORS.includes(res[res.length - 1]) ? "" : " " + id); // if last character already is a operator then -> do nothing
            } else res = res === "0" ? id : res + (OPERATORS.includes(res[res.length - 1]) ? " " : "") + id;  // if last character is a operator -> only then add space

            renderScreen();
        }

        function doCalculation() {
            const [a, operator, b] = res.split(" ");
            if (![a, b, operator].includes(undefined)) res = String(calculate(a, b, operator));
        }

        function calculate(a, b, operator) {
            if (operator === "+") return Number(a) + Number(b);
            if (operator === "-") return Number(a) - Number(b);
            if (operator === "x") return Number(a) * Number(b);
            if (operator === "/") return isFinite(Number(a) / Number(b)) ? Number(a) / Number(b) : 0; // to handle Infinity value
        }

        function renderScreen() {
            screenEle.innerText = res;
        }
        renderScreen();
    </script>
</body>

</html>
